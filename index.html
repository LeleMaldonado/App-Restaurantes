<style>

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 110px}

h1{font-size:2.6rem;line-height:1;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}

button{cursor:pointer}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}

.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}

.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photos div{position:relative}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.photos button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);line-height:1}

.add{display:flex;gap:8px;margin-bottom:14px}.add input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}

.s{font-style:normal;color:var(--line)}.s.f{color:var(--star)}
.s.h{background:linear-gradient(90deg,var(--star) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}

.catrow>div{display:flex;align-items:center}
.tbody{position:relative}.tbody h2{padding-right:34px}

.chips.wrap2{flex-wrap:wrap;overflow:visible}

.sbox{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:12px}

.tbody h2{padding-right:112px}

.dlg.wide{max-width:460px;max-height:92vh;overflow:auto}.dlg .card{width:100%;border-radius:10px;display:block;margin-bottom:14px}
.rowbtn{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;font-weight:600;color:var(--ink)}

.sort{flex-wrap:wrap}.sort select{flex:1;min-width:150px}

.chips{padding:3px;margin:0 0 13px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap2{padding:0;margin:0}
.sbox{margin-bottom:13px}.add{margin-bottom:13px}
.rest{position:relative}
.dirbtn{padding:7px 10px;line-height:0}
.combo{position:relative;flex:1;min-width:0}.combo input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);overflow:hidden}
.sug:empty{display:none}
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;color:var(--ink)}
.opt:last-child{border-bottom:0}button.opt:hover,button.opt:focus-visible{background:var(--chip)}
.plus{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.info{margin-top:12px;display:grid;gap:10px}.hrs{font-size:.92rem}.hrs summary{cursor:pointer;margin-top:6px;font-weight:600}.hrs details div{padding:2px 0}
.tag{font-size:.78rem;border-radius:999px;padding:2px 10px;font-weight:600;margin-right:6px}
.tag.ok{background:#CDEFD9;color:#0F5A32}.tag.no{background:var(--chip);color:var(--mute)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.ok{background:#14452C;color:#9FE6BE}}

.mapbtn{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);text-align:left;color:var(--ink)}
.mapcap{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:.88rem;font-weight:600}
.navbtns{display:grid;gap:8px;margin-top:14px}.navbtns a{text-align:center;text-decoration:none;display:block}
.tools button{padding:5px}.tbody h2{padding-right:118px}.ticket{grid-template-columns:80px 1fr}

:root{--rE:#A4572A;--rEf:#F4E2D3;--rD:#5B6E86;--rDf:#E4EAF2;--rI:#B07A00;--rIf:#FBE9B5}

.bcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:.82rem;color:var(--ink)}

.editbtn{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mute);padding:8px;line-height:0;border-radius:6px;cursor:pointer}
.fld input:disabled,.fld textarea:disabled{background:var(--chip);border-color:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
</style>
</head>

<script>function theme(){var el=document.documentElement;if(S.prof.theme==="auto")el.removeAttribute("data-theme");else el.setAttribute("data-theme",S.prof.theme)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){return all().filter(function(x){return x.id===id})[0]}
function n1(x){return (Math.round(x*10)/10).toFixed(1).replace(".",",")}
function sh(n){n=Math.round(n*2)/2;var h="";for(var i=1;i<=5;i++)h+='<i class="s '+(n>=i?"f":(n>=i-.5&&n>0?"h":""))+'">★</i>';return h}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){el.className=""},2800)}
function hav(a,b,c,d){var p=Math.PI/180,x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2),q=x*x+Math.cos(a*p)*Math.cos(c*p)*y*y;return 12742*Math.asin(Math.sqrt(q))}
function kmt(x){return (x<10?x.toFixed(1):String(Math.round(x))).replace(".",",")}
function stat(r){var m=S.prof.vis==="public"?S.mine.filter(function(v){return v.rid===r.id}):[],s=0;m.forEach(function(v){s+=v.score});var n=r.n+m.length;return{n:n,avg:n?(r.n*r.avg+s)/n:0}}
function globalAvg(){var t=0,c=0;all().forEach(function(r){var s=stat(r);t+=s.avg*s.n;c+=s.n});return c?t/c:4}
function chips(list,sel,act){return list.map(function(c){return'<button class="chip" data-a="'+act+'" data-v="'+esc(c)+'" aria-pressed="'+(c===sel)+'">'+esc(c)+'</button>'}).join("")}
function seg(act,opts,cur){return'<div class="seg">'+opts.map(function(o){return'<button data-a="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(o[0]===cur)+'">'+o[1]+'</button>'}).join("")+'</div>'}
function opts(list,cur){return list.map(function(o){return'<option value="'+o[0]+'"'+(o[0]===cur?" selected":"")+'>'+o[1]+'</option>'}).join("")}
function matchFav(r){return S.prof.favs.indexOf(r.cuisine)>=0}
function readImg(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){cb(im)};im.src=fr.result};fr.readAsDataURL(file)}
function addAvatar(file){readImg(file,function(im){var s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.prof.photo=c.toDataURL("image/jpeg",.8);save();render()})}
function toggle(arr,v){var i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1)}

function metrics(R0){
  var seen={},R=R0.filter(function(v){var k=v.rid+"|"+v.date;if(seen[k])return false;seen[k]=1;return true});
  var rid={},cu={},ci={},lo={},ba={},dc={},ad={},m={n:R.length,maxSame:0,t100:0,t150:0,full:0,night:0,early:0,ph:0};
  R.forEach(function(v){var r=byId(v.rid);if(!r)return;rid[v.rid]=(rid[v.rid]||0)+1;cu[r.cuisine]=1;if(r.city!==NEAR)ci[r.city]=1;if(r.n<20)lo[r.id]=1;if(r.id.charAt(0)==="x")ad[r.id]=1;if(r.cuisine==="Bar")ba[r.id]=1;if(r.cuisine==="Doces")dc[r.id]=1;
    var L=(v.text||"").length,hp=v.photos&&v.photos.length>0;if(L>=100)m.t100++;if(L>=150)m.t150++;if(L>0&&hp)m.full++;if(hp)m.ph++;
    if(v.id>1e12){var h=new Date(v.id).getHours();if(h<5)m.night++;else if(h<8)m.early++}});
  m.distinct=Object.keys(rid).length;Object.keys(rid).forEach(function(k){m.maxSame=Math.max(m.maxSame,rid[k])});
  m.cuis=Object.keys(cu).length;m.cities=Object.keys(ci).length;m.low=Object.keys(lo).length;m.added=Object.keys(ad).length;m.bars=Object.keys(ba).length;m.doces=Object.keys(dc).length;m.cu=cu;
  COLLS.forEach(function(c,i){m["c"+i]=c.items.filter(function(x){return cu[x]}).length});
  m.xp=m.distinct*20+m.t150*10+m.ph*5+m.cities*30;return m}
function bst(b,m){var v=m[b[7]],g=b[6],lv=g.filter(function(x){return v>=x}).length,t=g.length>1,mx=lv===g.length,nx=mx?g[g.length-1]:g[lv],pv=lv?g[lv-1]:0;
  return{v:v,g:g,lv:lv,on:lv>0,tiered:t,max:mx,rk:t?TK[Math.max(lv,1)-1]:b[3],nx:nx,p:mx?1:Math.max(0,(v-pv)/(nx-pv))}}
function featOf(m,id){var b=BADGES.filter(function(x){return x[0]===id})[0];return b&&bst(b,m).on?b:null}
function unlockDate(b,R,goal){var q=R.slice().sort(function(a,c){return a.date<c.date?-1:a.date>c.date?1:a.id-c.id});for(var k=1;k<=q.length;k++){if(metrics(q.slice(0,k))[b[7]]>=goal)return q[k-1].date}return null}

  return'<svg class="emb" width="'+z+'" height="'+z+'" viewBox="-6 -6 76 76" aria-hidden="true">'+ring+'<g style="fill:'+(st.on?c.f:"var(--chip)")+';stroke:'+(st.on?c.c:"var(--line)")+'" stroke-width="3" stroke-linejoin="round">'+SHP[st.rk]+'</g><g transform="translate(20 20)" fill="none" style="stroke:'+(st.on?c.c:"var(--mute)")+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="'+(st.on?1:.55)+'">'+g+'</g></svg>'}

function profView(){
  if(S.pview==="favs")return favView();
  if(S.pview==="badges")return badgesView();
  var p=S.prof,cnt={},best="–",bn=0,t=0,rids=[],cts=[],m0=metrics(S.mine),fb0=featOf(m0,p.badge),dis=S.pedit?"":" disabled";
  S.mine.forEach(function(v){t+=v.score;var r=byId(v.rid);if(r){cnt[r.cuisine]=(cnt[r.cuisine]||0)+1;if(cnt[r.cuisine]>bn){bn=cnt[r.cuisine];best=r.cuisine}if(rids.indexOf(r.id)<0)rids.push(r.id);if(r.city!==NEAR&&cts.indexOf(r.city)<0)cts.push(r.city)}});
  var ini=(p.name||"?").trim().charAt(0).toUpperCase();
  function bd(n,d,v,g){return'<div class="badgeitem"><b>'+n+'</b><br><span class="meta">'+d+'</span><div class="prog"><i style="width:'+Math.min(100,v/g*100)+'%"></i></div><span class="meta">'+v+' de '+g+'</span></div>'}
  return'<div class="phead"><button class="avbtn" data-a="avmenu" aria-label="Foto de perfil. Toque para alterar ou remover">'+(p.photo?'<img class="av" src="'+p.photo+'" alt="">':'<div class="av" aria-hidden="true">'+esc(ini)+'</div>')+'<span class="avedit" aria-hidden="true">'+svg(G.camera,14)+'</span></button>'+'<div><h2 style="margin:0">'+esc(p.name||"Sem nome")+'</h2><span class="meta">@'+esc(p.user)+'</span>'+(fb0?'<br><span class="fpill">'+emblem(fb0,m0,26)+esc(fb0[1])+'</span>'+(p.vis==="public"?"":'<br><span class="meta" style="font-size:.78rem">Só você vê (perfil privado)</span>'):"")+'</div></div>'
    +'<div class="sec"><h2>Estatísticas</h2><div class="statg"><div><b>'+S.mine.length+'</b><span class="meta">avaliações</span></div><div><b>'+(S.mine.length?n1(t/S.mine.length):"–")+'</b><span class="meta">nota média que você dá</span></div><div><b>'+esc(best)+'</b><span class="meta">cozinha mais avaliada</span></div><div><b>'+S.wish.length+'</b><span class="meta">em Quero Conhecer</span></div></div></div>'
  +'<button class="sec rowbtn" data-a="favs"><span>Restaurantes Favoritos ('+S.favr.length+')</span><span aria-hidden="true">›</span></button>'
  +badgeSec(m0)
  +'<div class="sec" style="position:relative"><h2>Sobre você</h2>'+(S.pedit?"":'<button class="editbtn" data-a="pedit" aria-label="Editar informações do perfil">'+svg(IC.pencil,18)+'</button>')+'<label class="fld">Nome<input id="pname" value="'+esc(p.name)+'"'+dis+'></label><label class="fld">Usuário<input id="puser" value="'+esc(p.user)+'"'+dis+'></label><label class="fld">Bio<textarea id="pbio" rows="2" placeholder="Conte um pouco sobre seu gosto"'+dis+'>'+esc(p.bio)+'</textarea></label>'+(S.pedit?'<div class="acts"><button class="btn" data-a="psave">Salvar</button><button class="btn ghost" data-a="pcancel">Cancelar</button></div>':"")+'</div>'
  +'<div class="sec"><h2>Privacidade do perfil</h2>'+seg("pvis",[["private","Privado"],["public","Público"]],p.vis)+'<p class="meta">'+(p.vis==="public"?"Suas avaliações são visíveis para todos e entram na nota dos restaurantes.":"Suas avaliações só são vistas por quem receber o compartilhamento e não entram na nota dos restaurantes.")+'</p></div>'
  +'<div class="sec"><h2>Preferências</h2><p class="meta" style="margin:0 0 8px">Cozinhas favoritas</p><div class="chips wrap2">'+CUIS.map(function(c){return'<button class="chip" data-a="cfav" data-v="'+esc(c)+'" aria-pressed="'+(p.favs.indexOf(c)>=0)+'">'+esc(c)+'</button>'}).join("")+'</div><p class="meta" style="margin:8px 0 0">Restaurantes que combinam recebem uma etiqueta em Explorar.</p></div>'
  +'<div class="sec"><h2>Configurações</h2><p class="meta" style="margin:0 0 8px">Tema</p>'+seg("theme",[["auto","Automático"],["light","Claro"],["dark","Escuro"]],p.theme)+'</div>'}

  if(S.confirm===null){m.innerHTML="";return}

  document.getElementById("cbtn").focus()}
function render(){
  document.getElementById("app").innerHTML=S.tab==="rank"?rank():S.tab==="mine"?mineView():S.tab==="wish"?wishView():profView();
  document.getElementById("nav").innerHTML=[["rank","Explorar",IC.search],["mine","Minhas Avaliações",IC.star],["wish","Quero Conhecer",IC.mark],["prof","Perfil",IC.user]].map(function(t){return'<button data-a="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':"")+'>'+svg(t[2],22)+'<span>'+t[1]+'</span></button>'}).join("");
  modal();saveUI()}

function doSave(){
  var f=S.f,rid=f.rid;
  if(!rid){toast("Escolha o restaurante.");return}
  if(rid==="__new"&&!f.name.trim()){toast("Digite o nome do restaurante.");return}
  if(!CATS.some(function(k){return f.r[k[0]]>0})){toast("Dê estrelas a pelo menos uma categoria.");return}
  if(S.editId){var ev=S.mine.filter(function(x){return x.id===S.editId})[0];if(ev){ev.r=JSON.parse(JSON.stringify(f.r));ev.score=avgR(f.r);ev.text=f.text.trim();ev.date=f.date;ev.photos=f.photos}S.editId=null;var ok2=save();S.f=newF();S.compose=false;S.tab="mine";render();toast(ok2?"Avaliação atualizada":"Atualizada, mas sem espaço para guardar no navegador");return}
  if(rid==="__new"){rid="x"+Date.now();S.extra.push({id:rid,name:f.name.trim(),cuisine:f.cuisine||"Outros",price:"$$",uf:f.uf,city:f.city,area:f.city,km:1,la:null,lo:null,n:0,avg:0})}
  S.mine.push({id:Date.now(),rid:rid,r:JSON.parse(JSON.stringify(f.r)),score:avgR(f.r),text:f.text.trim(),date:f.date,photos:f.photos});
  S.wish=S.wish.filter(function(w){return w!==rid});
  var ok=save();S.f=newF();S.compose=false;S.tab="mine";render();toast(ok?"Avaliação salva":"Salva, mas sem espaço para guardar no navegador")}

function locate(silent){
  if(!navigator.geolocation){if(!silent)toast("Seu navegador não oferece localização.");return}
  if(!silent)toast("Obtendo sua localização…");
  navigator.geolocation.getCurrentPosition(function(p){S.pos={la:p.coords.latitude,lo:p.coords.longitude};
    if(silent){var l=document.getElementById("list");if(l&&S.mode==="gps"&&S.tab==="rank")l.innerHTML=listHtml();saveUI();return}
    S.mode="gps";S.cuisine="Todas";S.open=null;render();toast("Usando sua localização atual")},
  function(){if(!silent)toast("Não foi possível obter sua localização. Verifique a permissão do navegador.")},{timeout:8000})}

function addPhotos(files){Array.prototype.slice.call(files,0,MAXP-S.f.photos.length).forEach(function(file){readImg(file,function(im){var k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);if(S.f.photos.length<MAXP)S.f.photos.push(c.toDataURL("image/jpeg",.7));if(S.compose)render()})})}

  function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath()}
  var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1B2D55");g.addColorStop(1,"#0B1426");x.fillStyle=g;x.fillRect(0,0,W,H);
  if(ph){x.save();x.beginPath();x.rect(0,0,W,hh);x.clip();var sc=Math.max(W/ph.width,hh/ph.height),pw=ph.width*sc,pH=ph.height*sc;x.drawImage(ph,(W-pw)/2,(hh-pH)/2,pw,pH);x.fillStyle="rgba(0,0,0,.2)";x.fillRect(0,0,W,hh);var tt=hh/H,cr=Math.round(27-16*tt),cg=Math.round(45-25*tt),cb=Math.round(85-47*tt),og=x.createLinearGradient(0,hh-340,0,hh);og.addColorStop(0,"rgba("+cr+","+cg+","+cb+",0)");og.addColorStop(1,"rgb("+cr+","+cg+","+cb+")");x.fillStyle=og;x.fillRect(0,hh-340,W,341);x.restore()}
  else{x.fillStyle="#C8102E";x.beginPath();x.arc(W-70,80,230,0,7);x.fill()}
  x.textBaseline="alphabetic";x.fillStyle="#fff";x.font="800 46px "+HF;x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=ph?12:0;x.fillText("Comanda",60,100);x.shadowBlur=0;
  x.font="800 76px "+HF;nameL.forEach(function(l,i){x.fillText(l,60,hh-110-(nameL.length-1-i)*86)});
  x.font="500 32px "+BF;x.fillStyle="#B8C4D6";x.fillText(r.cuisine+" · "+r.city,60,hh-52);
  x.fillStyle="#FF6B7D";x.font="800 210px "+HF;x.fillText(n1(v.score),50,y0+205);
  x.font="62px "+BF;var sw=x.measureText("★").width,sv=Math.round(v.score*2)/2;

  x.font="500 28px "+BF;x.fillStyle="#9AA7BA";x.fillText("nota final",62,y0+350);
  CATS.forEach(function(k,i){var ry=y0+30+i*105,val=v.r[k[0]];
    x.font="500 32px "+BF;x.fillStyle="#C9D3E3";x.textAlign="left";x.fillText(k[1],470,ry+30);
    x.font="800 36px "+HF;x.fillStyle="#fff";x.textAlign="right";x.fillText(n1(val),1020,ry+32);x.textAlign="left";

async function doShare(){

  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:sh2.text});return}}catch(e){if(e&&e.name==="AbortError")return}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  if(a==="tab"){if(S.pedit){if(S.pbak)Object.assign(S.prof,S.pbak);S.pedit=false;S.pbak=null}S.tab=v;S.pview="";S.wnew=null;if(v!=="mine"){S.compose=false;S.editId=null}render();window.scrollTo(0,0)}
  else if(a==="mode"){if(v==="gps")locate();else{S.mode="city";render()}}
  else if(a==="cuisine"){S.cuisine=v;S.open=null;render()}
  else if(a==="wcuisine"){S.wcuisine=v;render()}
  else if(a==="rdir"){S.rdir=S.rdir==="asc"?"desc":"asc";render()}
  else if(a==="mdir"){S.mdir=S.mdir==="asc"?"desc":"asc";render()}
  else if(a==="open"){S.open=S.open===v?null:v;render()}
  else if(a==="rate"){S.editId=null;S.f=newF();S.f.rid=v;S.tab="mine";S.compose=true;render();window.scrollTo(0,0)}
  else if(a==="compose"){S.editId=null;S.f=newF();S.compose=true;render()}
  else if(a==="back"){S.compose=false;S.editId=null;render()}
  else if(a==="edit"){var ed=S.mine.filter(function(x){return x.id===+v})[0];S.f=Object.assign(newF(),{rid:ed.rid,r:JSON.parse(JSON.stringify(ed.r)),text:ed.text||"",date:ed.date,photos:(ed.photos||[]).slice()});S.editId=ed.id;S.tab="mine";S.compose=true;render();window.scrollTo(0,0)}
  else if(a==="star"){var c=b.dataset.c;S.f.r[c]=S.f.r[c]===+v?0:+v;render()}
  else if(a==="rmphoto"){S.f.photos.splice(+v,1);render()}
  else if(a==="wish"){var i=S.wish.indexOf(v);if(i<0){S.wish.push(v);toast("Adicionado a Quero Conhecer")}else S.wish.splice(i,1);save();render()}
  else if(a==="wadd"){var n=document.getElementById("wname").value.trim();if(!n){toast("Digite o nome do local.");return}
    var m=all().filter(function(r){return norm(r.name)===norm(n)})[0];
    if(m){if(S.wish.indexOf(m.id)>=0){toast("Esse local já está na lista.");return}S.wish.push(m.id);save();render();toast("Adicionado a Quero Conhecer")}
    else{S.wnew={name:n,uf:S.uf,city:S.city,cuisine:"Outros"};render()}}
  else if(a==="wncancel"){S.wnew=null;render()}
  else if(a==="wnsave"){var w=S.wnew;if(!w.name.trim()){toast("Digite o nome do local.");return}
    var ex=all().filter(function(r){return norm(r.name)===norm(w.name)&&r.city===w.city})[0],id2=ex?ex.id:"x"+Date.now();
    if(S.wish.indexOf(id2)>=0){toast("Esse local já está na lista.");return}
    if(!ex)S.extra.push({id:id2,name:w.name.trim(),cuisine:w.cuisine,price:"$$",uf:w.uf,city:w.city,area:w.city,km:1,la:null,lo:null,n:0,avg:0});
    S.wish.push(id2);S.wnew=null;save();render();toast("Adicionado a Quero Conhecer")}
  else if(a==="badges"){S.pview="badges";S.bcat="Todas";render();window.scrollTo(0,0)}
  else if(a==="bback"){S.pview="";render()}
  else if(a==="bcat"){S.bcat=v;render()}
  else if(a==="badge"){S.badge=v;modal()}
  else if(a==="closebadge"){S.badge=null;modal()}
  else if(a==="equip"){S.prof.badge=S.prof.badge===v?"":v;save();render()}
  else if(a==="photo"){var pr=v.split(":");S.lb={id:+pr[0],i:+pr[1]};modal()}
  else if(a==="lbclose"){S.lb=null;modal()}
  else if(a==="lbprev"){S.lb.i--;modal()}
  else if(a==="lbnext"){S.lb.i++;modal()}
  else if(a==="pedit"){S.pbak={name:S.prof.name,user:S.prof.user,bio:S.prof.bio};S.pedit=true;render()}
  else if(a==="psave"){S.pedit=false;S.pbak=null;save();render();toast("Perfil atualizado")}
  else if(a==="pcancel"){if(S.pbak)Object.assign(S.prof,S.pbak);S.pedit=false;S.pbak=null;render()}

  else if(a==="closeav"){S.avmenu=false;modal()}
  else if(a==="avremove"){S.prof.photo="";S.avmenu=false;save();render();toast("Foto removida")}
  else if(a==="map"){S.navr=v;modal()}
  else if(a==="closenav"){S.navr=null;modal()}
  else if(a==="winfo"){S.wopen=S.wopen===v?null:v;render()}
  else if(a==="wsel"){S.wish.push(v);save();render();toast("Adicionado a Quero Conhecer")}
  else if(a==="save")doSave();
  else if(a==="share")share(+v);
  else if(a==="doshare")doShare();
  else if(a==="closeshare"){S.share=null;modal()}
  else if(a==="rfav"){toggle(S.favr,v);save();render()}
  else if(a==="favs"){S.pview="favs";render();window.scrollTo(0,0)}
  else if(a==="pback"){S.pview="";render()}
  else if(a==="ask"){S.confirm=+v;modal()}
  else if(a==="cancel"){S.confirm=null;modal()}
  else if(a==="delok"){S.mine=S.mine.filter(function(x){return x.id!==S.confirm});S.confirm=null;save();render();toast("Avaliação excluída")}
  else if(a==="pvis"){S.prof.vis=v;save();render()}
  else if(a==="cfav"){toggle(S.prof.favs,v);save();render()}
  else if(a==="theme"){S.prof.theme=v;save();theme();render()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&(S.confirm!==null||S.share||S.navr||S.badge||S.avmenu||S.lb)){S.confirm=null;S.share=null;S.navr=null;S.badge=null;S.avmenu=false;S.lb=null;modal()}});
document.addEventListener("input",function(e){var i=e.target.id,x=e.target.value;setTimeout(saveUI,0);
  if(i==="km"){S.km=+x;document.getElementById("kmv").textContent=S.km+" km";document.getElementById("list").innerHTML=listHtml()}
  else if(i==="wname"){document.getElementById("wsug").innerHTML=sugHtml(x)}
  else if(i==="wnn")S.wnew.name=x;
  else if(i==="q"){S.q=x;document.getElementById("list").innerHTML=listHtml()}
  else if(i==="mq"){S.mq=x;document.getElementById("mlist").innerHTML=ticketsHtml()}
  else if(i==="text"||i==="name"||i==="date")S.f[i]=x;
  else if(i==="pname")S.prof.name=x;
  else if(i==="puser")S.prof.user=x.replace(/\s/g,"");
  else if(i==="pbio")S.prof.bio=x});
document.addEventListener("change",function(e){var i=e.target.id,x=e.target.value;
  if(i==="rid"){S.f.rid=x;render()}
  else if(i==="fcuisine")S.f.cuisine=x;
  else if(i==="fuf"){S.f.uf=x;S.f.city=defCity(x);render()}
  else if(i==="fcity")S.f.city=x;
  else if(i==="wnc")S.wnew.cuisine=x;
  else if(i==="wnuf"){S.wnew.uf=x;S.wnew.city=defCity(x);render()}
  else if(i==="wncity")S.wnew.city=x;
  else if(i==="uf"){S.uf=x;S.city=defCity(x);S.open=null;render()}
  else if(i==="city"){S.city=x;S.open=null;render()}
  else if(i==="rsort"){S.rsort=x;S.rdir=(x==="dist"||x==="nome")?"asc":"desc";render()}
  else if(i==="msort"){S.msort=x;S.mdir=x==="alfa"?"asc":"desc";render()}
  else if(i==="photos")addPhotos(e.target.files);
  else if(i==="avatar"&&e.target.files[0]){S.avmenu=false;addAvatar(e.target.files[0])}
  else if(i==="puf"){S.prof.uf=x;S.prof.city=defCity(x);save();render()}
  else if(i==="pcity"){S.prof.city=x;save()}
  else if(i==="__none"){}});
document.addEventListener("focusin",function(e){if(e.target.id==="wname")document.getElementById("wsug").innerHTML=sugHtml(e.target.value)});
document.addEventListener("focusout",function(e){if(e.target.id==="wname")setTimeout(function(){var q=document.getElementById("wsug");if(q&&document.activeElement!==document.getElementById("wname"))q.innerHTML=""},250)});
document.addEventListener("mousedown",function(e){if(e.target.closest(".opt"))e.preventDefault()});
theme();render();
loadMun(S.uf);if(S.mode==="gps")locate(true);
</script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
